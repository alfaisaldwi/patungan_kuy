name: patungan_kuy
description: "PatunganKuy - bagi tagihan bareng teman dari foto struk."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  dartz: ^0.10.1
  http: ^1.2.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  carousel_slider: ^5.1.2
  persistent_bottom_nav_bar_v2: ^6.3.2
  showcaseview: ^5.1.0
  package_info_plus: ^9.0.1
  bloc: ^8.1.4
  gal: ^2.3.3
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/example/
    - assets/branding/
    - assets/google_fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon_rounded.png
  image_path_ios: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFD23F"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

flutter_native_splash:
  color: "#FFFFFF"
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_icon_android12.png
  fullscreen: false
  web: false
