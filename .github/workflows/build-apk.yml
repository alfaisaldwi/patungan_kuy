name: Build APK

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install Android CMake & NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            yes | "$SDKMANAGER" --install "cmake;3.22.1" "ndk;28.2.13676358" > /dev/null && break
            echo "Gagal memasang (percobaan $attempt), coba lagi..."
            sleep 10
          done
          test -d "$ANDROID_HOME/cmake/3.22.1"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=SCANNER_API_URL=${{ secrets.SCANNER_API_URL }}
          --dart-define=SCANNER_APP_KEY=${{ secrets.SCANNER_APP_KEY }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/patungan_kuy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patungan_kuy
          path: build/app/outputs/flutter-apk/patungan_kuy.apk
          if-no-files-found: error
          retention-days: 14
